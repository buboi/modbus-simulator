csv_file = "data/topway_cu_data.csv"
update_interval = "1s"

[server]
listen_address = ":1502"

# Analyzer status (holding register 0 bit0: 0=off, 1=running)
[[registers]]
type = "holding"
address = 0
csv_column = "analyzer_status"

